spring:
  application:
    name: wool
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/wool?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${LOCAL_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true