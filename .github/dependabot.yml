# 의존성(라이브러리, GitHub Actions, Docker 베이스 이미지)의 보안 취약점과 새 버전을 매주 확인하고, 업데이트 PR을 자동으로 만든다.
# - 팀 규칙에 맞게 PR은 main이 아니라 develop으로 보낸다. (main으로는 develop에서만 PR을 받는다)
# - 같은 종류의 작은 업데이트(minor, patch)는 한 PR로 묶어서 PR이 쏟아지지 않게 한다.
# - 이 파일은 "버전 업데이트"용이다. 취약점 경고와 보안 업데이트 PR은 저장소 설정(Settings → Code security)에서 따로 켜야 한다.
# - Dockerfile의 베이스 이미지만 확인한다. compose.prod.yml에 적힌 이미지(Caddy는 digest 고정, MySQL)는 대상이 아니므로 바꿀 때 직접 확인하고 올린다.
# - target-branch는 버전 업데이트에만 적용된다. 보안 업데이트 PR은 저장소 기본 브랜치로 만들어진다. (켤 때 브랜치 규칙을 같이 확인한다)
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[CHORE]"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "[CHORE]"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "[CHORE]"
